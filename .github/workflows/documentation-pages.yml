name: Build and publish selected Keycloak documentation

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/documentation-pages.yml'
      - '.github/actions/java-setup/**'
      - '.github/actions/maven-cache/**'
      - '.mvn/**'
      - '**/pom.xml'
      - '**/src/main/**'
      - 'distribution/api-docs-dist/**'
      - 'docs/documentation/**'
      - 'mvnw'
      - 'pom.xml'
      - 'services/src/docs/**'
  workflow_dispatch:
    inputs:
      guides:
        description: "all or comma-separated IDs (e.g. server_admin,authorization_services)"
        type: string
        required: true
        default: all
      api_reference:
        description: Build JavaDocs and the REST API reference during a selected-guide build
        type: boolean
        required: false
        default: false

concurrency:
  group: keycloak-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' }}
    name: Build and validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.configure.outputs.selection }}
      selected_guides: ${{ steps.configure.outputs.selected_guides }}
      include_api_reference: ${{ steps.configure.outputs.include_api_reference }}
      pages_base_url: ${{ steps.configure.outputs.pages_base_url }}
      docs_branch: ${{ steps.configure.outputs.docs_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-java
        name: Setup Java
        uses: ./.github/actions/java-setup

      - id: maven-cache
        name: Maven cache
        uses: ./.github/actions/maven-cache

      - name: Test Pages assembly helper
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - id: configure
        name: Detect repository URL and selected guides
        env:
          GUIDE_SELECTION: ${{ inputs.guides || 'all' }}
          API_REFERENCE: ${{ inputs.api_reference || 'false' }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          DOCS_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          python3 .github/scripts/prepare-docs-pages.py configure \
            --repo-root . \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$DOCS_BRANCH" \
            --pages-base-url "$PAGES_BASE_URL" \
            --selection "$GUIDE_SELECTION" \
            --api-reference "$API_REFERENCE"

      - name: Build all documentation guides
        if: ${{ steps.configure.outputs.selection == 'all' }}
        run: |
          ./mvnw install -Dtest=!ExternalLinksTest -am \
            -pl docs/documentation/tests,docs/documentation/dist \
            -e -Pdocumentation

      - name: Build only selected documentation guides
        if: ${{ steps.configure.outputs.selection != 'all' }}
        env:
          MAVEN_MODULES: ${{ steps.configure.outputs.maven_modules }}
        run: |
          ./mvnw clean install -DskipTests -DskipProjectTests -am \
            -pl "$MAVEN_MODULES" -e -Pdocumentation

      - name: Build JavaDocs and REST API reference
        if: ${{ steps.configure.outputs.include_api_reference == 'true' }}
        run: |
          ./mvnw clean package -DskipTests -am \
            -pl services,distribution/api-docs-dist \
            -e -Pjboss-release -Ddist.api.docs

      - name: Assemble and validate GitHub Pages site
        env:
          SELECTION: ${{ steps.configure.outputs.selection }}
          API_REFERENCE: ${{ steps.configure.outputs.include_api_reference }}
          PAGES_BASE_URL: ${{ steps.configure.outputs.pages_base_url }}
          DOCS_BRANCH: ${{ steps.configure.outputs.docs_branch }}
        run: |
          python3 .github/scripts/prepare-docs-pages.py prepare \
            --repo-root . --output-dir _site \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$DOCS_BRANCH" \
            --pages-base-url "$PAGES_BASE_URL" \
            --selection "$SELECTION" \
            --api-reference "$API_REFERENCE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true # Keep .nojekyll in the published artifact.
          retention-days: 1

  publish:
    name: Publish GitHub Pages
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Required by deploy-pages to retrieve the Pages artifact.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke-test published site and fork-specific Edit links
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY: ${{ github.repository }}
          DOCS_BRANCH: ${{ needs.build.outputs.docs_branch }}
          SELECTION: ${{ needs.build.outputs.selection }}
          API_REFERENCE: ${{ needs.build.outputs.include_api_reference }}
        run: |
          python3 .github/scripts/prepare-docs-pages.py smoke \
            --base-url "$SITE_URL" \
            --repository "$REPOSITORY" \
            --branch "$DOCS_BRANCH" \
            --selection "$SELECTION" \
            --api-reference "$API_REFERENCE"
